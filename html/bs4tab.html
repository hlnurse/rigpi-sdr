<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
      integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="http://rigpi5.local/dist/jquery.bs4-scrolling-tabs.css"
    />

    <style>
      .left-side {
        width: 50%;
      }
      .right-side {
        width: 50%;
      }
      .nav-link {
        max-height: 30px;
        color: white;
      }
      .nav-tabs{
        border=none;
      }
      .tab-btn {
        color: #ddd;
        border: 1px solid #666;
        border-bottom: none;
        border-top-left-radius: 12px;
        border-top-right-radius: 12px;
        padding: 2px 10px;
        font-size: 15px;
        cursor: pointer;
        user-select: none;
        margin: 0 4px 0 0;
      }
      .panel-btn {
        background: black;          /* blue */
        border-color: black;
        color: white;
        left: 10px;
        height: 30px;
        position: absolute;
        border: 1px solid #1e293b;
        border-radius: 6px;
        margin-top:4px;
      }
      .panel-btn-label{
        margin-left: 0px;
      }
      .tab-pane {
        color: #ddd;
        border: 1px solid #666;
        border-bottom: none;
        border-top-left-radius: 12px;
        border-top-right-radius: 12px;
        padding: 5px 10px;
        font-size: 15px;
        cursor: pointer;
        user-select: none;
        margin: 0px 40px 40px 0;
      }
      body style:"background: #666">
    </style>
  </head>

  <body style="background: #666">
    <!-- Nav tabs -->
    <ul
      class="nav nav-tabs vertical-btn"
      role="tablist"
      style="background: #000; max-height: 50px; display: none"
    >
      <li class="nav-item">
        <a
          class="nav-link active tab-btn"
          href="#tab1"
          role="tab"
          data-toggle="tab"
          >SDR</a
        >
      </li>
      <li class="nav-item">
        <a class="nav-link tab-btn" href="#tab2" role="tab" data-toggle="tab"
          >RIG</a
        >
      </li>
      <li class="nav-item">
        <a class="nav-link tab-btn" href="#tab3" role="tab" data-toggle="tab"
          >AUDIO</a
        >
      </li>
      <li class="nav-item">
        <a class="nav-link tab-btn" href="#tab4" role="tab" data-toggle="tab"
          >DISPLAY</a
        >
      </li>
      <li class="nav-item">
        <a class="nav-link tab-btn" href="#tab5" role="tab" data-toggle="tab"
          >REMOTE</a
        >
      </li>
    </ul>

    <!-- Tab panes -->
    <div class="tab-content" style="display: none">
      <div role="tabpanel" class="tab-pane fade show active" id="tab1">
        <!-- Skeleton “API” buttons -->
        <button class="panel-btn btn btn-sm btn-outline-light" id="btnRigRead">
          Read Rig
        </button>
      </div>
      <div role="tabpanel" class="tab-pane fade show" id="tab2">
        &nbsp;
        <button class="panel-btn btn btn-sm btn-outline-light" id="btnRigFreq">
          Rig Freq Get
        </button>
        <p>
          <button
            class="panel-btn btn btn-sm btn-outline-light"
            id="btnRigFreqSet"
          >
            Rig Freq Set
          </button>
        </p>
      </div>
      <div role="tabpanel" class="tab-pane fade show" id="tab3">
        Tab 3 content...
      </div>
      <div role="tabpanel" class="tab-pane fade show" id="tab4">
        <div class="slider-row">
          <label
            ><span>Spectrum Floor</span><span id="floorLabel"> -80</span></label
          >
          <input
            id="floorSlider"
            class="range-slider"
            type="range"
            min="-140"
            max="20"
            step="1"
            value="-80"
            style="direction: ltr"
          />
        </div>
        <div class="slider-row">
          <label
            ><span>Waterfall Floor</span
            ><span id="wfFloorLabel">-90</span></label
          >
          <input
            id="wfFloorSlider"
            class="range-slider"
            type="range"
            min="-140"
            max="20"
            step="1"
            value="-90"
            style="direction: ltr"
          />
        </div>

        <div class="row">
          <span>WF Palette</span>
          <select class="panel-btn btn btn-sm btn-outline-light" id="wfPalette">
            <option value="classic">Classic</option>
            <option value="rainbow">Rainbow</option>
            <option value="gray">Gray</option>
          </select>
        </div>
      </div>
      <div role="tabpanel" class="tab-pane fade show" id="tab5">
        Tab 5 content...
      </div>
    </div>
    <script
      src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    >
      <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns"
        crossorigin="anonymous"
      >
      <script src="./dist/jquery.bs4-scrolling-tabs.js">    var DB_RANGE = 80; // visible dB window height

        (function ($) {
          "use strict";
          $(activate);
          function activate() {
            $(".nav-tabs")
              .scrollingTabs({
                enableSwiping: true,
                scrollToTabEdge: true,
                disableScrollArrowsOnFullyScrolled: true,
              })
              .on("ready.scrtabs", function () {
                $(".tab-content").show();
              });
          }
        })(jQuery);
        function sendControl(payload) {
          if (HAMLIB_ENABLE) payload.to_rig = true; // extra field; server may ignore
          //       console.log(payload);
          //        payload = "F 3702333\n";
          return fetch(CONTROL_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          }).catch((err) => console.error("POST /api/control failed:", err));
        }
        floorSlider.addEventListener("input", (e) => {
          state.floor = parseFloat(e.target.value);
          floorLabel.textContent = String(state.floor);
          updateSliderFill(floorSlider);
        });
    </script>
    <!-- </div> -->
    <!-- </div> -->
  </body>
</html>
