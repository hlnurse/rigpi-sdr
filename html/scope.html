<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>IC-7300 Spectrum Viewer (rigctld)</title>
    <style>
      body {
        background: #000;
        color: #fff;
        margin: 0;
        font-family: sans-serif;
      }
      .controls {
        padding: 10px;
        position: fixed;
        left: 10px;
        top: 10px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 6px;
        z-index: 10;
      }
      label {
        display: inline-block;
        margin-right: 10px;
        font-size: 13px;
      }
      input[type="number"] {
        width: 120px;
      }
      canvas {
        display: block;
      }
      #toast {
        position: fixed;
        right: 10px;
        top: 10px;
        background: rgba(0, 0, 0, 0.75);
        color: #0ff;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #0ff;
        opacity: 0;
        transition: opacity 0.15s;
      }
      #toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <div><strong>rigctld scope</strong></div>
      <div style="margin-top: 6px">
        <label
          >Span (Hz)<br />
          <input
            id="spanSlider"
            type="range"
            min="1000"
            max="5000000"
            step="1000"
            value="5000000"
          />
        </label>
        <label
          >Center (MHz)<br />
          <input id="centerFreq" type="number" step="0.001" value="7.100" />
        </label>
      </div>
      <div style="margin-top: 6px">
        <button id="setCenterDisplay">Set Center (display only)</button>
        <button id="setCenterTune">Set Center &amp; Tune</button>
      </div>
      <hr style="border-color: #333" />
      <div>
        <label
          >Bins:
          <input id="binSlider" type="range" min="50" max="1024" value="500" />
        </label>
        <input
          id="binInput"
          type="number"
          min="50"
          max="1024"
          value="500"
          style="width: 70px"
        />
      </div>
      <div style="margin-top: 6px">
        <label><input id="avgToggle" type="checkbox" /> Averaging</label>
        <label
          >Averaging factor:
          <input
            id="avgFactor"
            type="range"
            min="0.01"
            max="0.99"
            step="0.01"
            value="0.5"
          />
        </label>
      </div>
      <div style="margin-top: 6px">
        <label
          >Waterfall line height:
          <input id="lineHeight" type="range" min="1" max="8" value="2" />
        </label>
        <button id="resetPeak">Reset Peak</button>
      </div>
    </div>

    <div id="toast"></div>

    <canvas id="spectrumCanvas"></canvas>
    <canvas id="waterfallCanvas"></canvas>

    <script src="script.js"></script>
  </body>
</html>
